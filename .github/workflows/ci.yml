name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS and iOS
    # CHANGE: Exercise Swift Crypto's Apple implementation and the declared iOS floor on demand
    # and for every release tag, while keeping ordinary pull-request CI economical.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # CHANGE: macos-15 defaults to Xcode 16.4, which predates Swift 6.2.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve and verify root and pipeline locks
        run: |
          # CHANGE: Container jobs may not expose checkout Git metadata; compare exact bytes.
          root_lock_snapshot="$(mktemp)"
          pipeline_lock_snapshot="$(mktemp)"
          trap 'rm -f "$root_lock_snapshot" "$pipeline_lock_snapshot"' 0
          cp Package.resolved "$root_lock_snapshot"
          cp IntegrationTests/CIDRMergePipeline/Package.resolved "$pipeline_lock_snapshot"
          swift package resolve
          swift package --package-path IntegrationTests/CIDRMergePipeline resolve
          cmp "$root_lock_snapshot" Package.resolved
          cmp "$pipeline_lock_snapshot" IntegrationTests/CIDRMergePipeline/Package.resolved

      - name: Build and test root package
        run: |
          swift build
          swift test

      - name: Checkout cidrmerge 0.2.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RouteObjects/cidrmerge
          # CHANGE: Pin the signed 0.2.0 release commit for immutable acceptance.
          ref: 117b87b25ded47d5cc74e10e165c1bba8a94458f
          path: cidrmerge-pipeline

      - name: Run cidrmerge pipeline acceptance
        env:
          CIDRMERGE_PACKAGE: ${{ github.workspace }}/cidrmerge-pipeline
        run: ./scripts/check-cidrmerge-pipeline.sh

      - name: Build SwiftNIO echo example
        run: swift build --package-path Examples/NIOTCPEchoAdmissionServer

      - name: Build CIDRAdmission for the iOS 18 simulator
        run: |
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build \
            --target CIDRAdmission \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"

  linux:
    name: Linux Swift 6.2.4
    runs-on: ubuntu-24.04

    # Linux runner instead of macOS.
    # CHANGE: Match the Swift 6.2 minimum required by CIDR and Crypto.
    container:
      image: swift:6.2.4-noble

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Resolve and verify root and pipeline locks
        run: |
          # CHANGE: Container jobs may not expose checkout Git metadata; compare exact bytes.
          root_lock_snapshot="$(mktemp)"
          pipeline_lock_snapshot="$(mktemp)"
          trap 'rm -f "$root_lock_snapshot" "$pipeline_lock_snapshot"' 0
          cp Package.resolved "$root_lock_snapshot"
          cp IntegrationTests/CIDRMergePipeline/Package.resolved "$pipeline_lock_snapshot"
          swift package resolve
          swift package --package-path IntegrationTests/CIDRMergePipeline resolve
          cmp "$root_lock_snapshot" Package.resolved
          cmp "$pipeline_lock_snapshot" IntegrationTests/CIDRMergePipeline/Package.resolved

      - name: Build root package
        run: swift build

      - name: Test root package
        run: |
          swift test
          swift test -c release

      - name: Checkout cidrmerge 0.2.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RouteObjects/cidrmerge
          # CHANGE: Pin the signed 0.2.0 release commit for immutable acceptance.
          ref: 117b87b25ded47d5cc74e10e165c1bba8a94458f
          path: cidrmerge-pipeline

      - name: Run cidrmerge pipeline acceptance
        env:
          CIDRMERGE_PACKAGE: ${{ github.workspace }}/cidrmerge-pipeline
        run: ./scripts/check-cidrmerge-pipeline.sh

      - name: Build SwiftNIO echo example
        run: swift build --package-path Examples/NIOTCPEchoAdmissionServer

  benchmarks:
    name: Benchmarks Swift 6.3.3
    runs-on: ubuntu-24.04
    # CHANGE: Benchmark's Swift 6.2 manifest conflicts with CIDR's ArgumentParser requirement.
    container:
      image: swift:6.3.3-noble

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Build benchmark target
        # CHANGE: Compile without Benchmark's optional allocation interposer.
        env:
          BENCHMARK_DISABLE_MALLOC_INTERPOSER: "1"
        run: swift build --package-path Benchmarks -c release --target CIDRAdmissionBenchmarkTarget
