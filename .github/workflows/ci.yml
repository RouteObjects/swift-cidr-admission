name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS and iOS
    # CHANGE: Exercise Swift Crypto's Apple implementation and the declared iOS floor on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Verify locked resolution
        run: git diff --exit-code -- Package.resolved

      - name: Build and test root package
        run: |
          swift build
          swift test

      - name: Build SwiftNIO echo example
        run: swift build --package-path Examples/NIOTCPEchoAdmissionServer

      - name: Build benchmark target
        run: swift build --package-path Benchmarks -c release --target CIDRAdmissionBenchmarkTarget

      - name: Build CIDRAdmission for the iOS 18 simulator
        run: |
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build \
            --target CIDRAdmission \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"

  linux:
    name: Linux Swift 6.1.3
    runs-on: ubuntu-24.04

    # Linux runner instead of macOS.
    # Pinned official Swift 6.1.x image for repeatable package validation.
    container:
      image: swift:6.1.3-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build root package
        run: swift build

      - name: Test root package
        run: swift test

      - name: Build SwiftNIO echo example
        run: swift build --package-path Examples/NIOTCPEchoAdmissionServer

      - name: Build benchmark target
        run: swift build --package-path Benchmarks -c release --target CIDRAdmissionBenchmarkTarget
